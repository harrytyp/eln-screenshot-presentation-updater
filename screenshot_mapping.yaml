# Mapping of PPTX images to ELN pages for screenshot capture
# Each entry maps an image (identified by slide number + shape name) to:
#   - url: the ELN page URL to navigate to
#   - description: what the screenshot should capture
#   - wait_for: CSS selector or text to wait for before shooting
#   - crop: optional [x, y, w, h] crop region in px (null = full page)
#   - actions: optional list of actions to perform before screenshot
#
# Images NOT listed here are icons/logos/diagrams that should be left unchanged.

