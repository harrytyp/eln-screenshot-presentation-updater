# Mapping of PPTX images to ELN pages for screenshot capture
#
# Fields:
#   slide / shape — identify the image in the PPTX
#   url — page to navigate to
#   description — human-readable purpose
#   wait_for — text to wait for before capturing
#   expected_keywords — page validation (Issue #2): rejects if none found
#   viewport — [width, height] — custom viewport size (Issue #1)
#   crop — [x, y, w, h] — crop region on the captured screenshot (Issue #1)
#   actions — interaction sequence before capture (Issue #3):
#     click: click element matching label text
#     type: type into element matching label
#     wait: wait N seconds
#     scroll: scroll the page
#
# Images NOT listed here are icons/logos/diagrams left unchanged.

screenshots:

